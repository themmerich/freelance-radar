<ng-container *transloco="let t">
  <header class="mx-auto flex w-full max-w-7xl items-center gap-8 px-6 pt-4">
    <span class="font-semibold">📡 Freelance Radar</span>
    <!-- nav bleibt als Landmark; die aktive Karte steuert p-tabs über den Routen-Pfad. -->
    <nav [attr.aria-label]="t('nav.label')">
      <!-- Ohne Navigatoren: zwei Karten laufen nie über, und PrimeNG spart sich den ResizeObserver. -->
      <p-tabs [value]="activeTab()" [showNavigators]="false">
        <p-tablist>
          @for (tab of tabs; track tab.route) {
            <p-tab [value]="tab.route" [routerLink]="tab.route">{{ t(tab.label) }}</p-tab>
          }
        </p-tablist>
      </p-tabs>
    </nav>
  </header>
</ng-container>
<router-outlet />
<p-toast position="top-right" />
