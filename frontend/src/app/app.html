<ng-container *transloco="let t">
  <div class="app-shell relative flex min-h-screen bg-surface-50 lg:static dark:bg-surface-950">
    <!-- Mobil eine Schublade über dem Inhalt (`fixed`, damit sie auch nach dem Scrollen im Bild
         aufklappt), auf Desktop eine feste Spalte — `sticky`, sonst endet das Grün bei langen
         Seiten mitten im Bild. -->
    <aside
      id="app-sidebar"
      class="fixed top-0 left-0 z-10 h-screen w-[280px] shrink-0 bg-primary select-none lg:sticky lg:block"
      [class.hidden]="!menuOpen()"
      [class.animate-fadeinleft]="menuOpen()"
    >
      <div class="flex h-full flex-col">
        <div class="flex items-center gap-3 p-4 text-primary-contrast">
          <span class="text-2xl leading-none">📡</span>
          <span class="text-lg leading-tight font-semibold">Freelance Radar</span>
          <!-- Die offene Schublade deckt den Menü-Knopf der Topbar ab, sie braucht ihr eigenes X. -->
          <button
            type="button"
            class="ml-auto cursor-pointer text-primary-contrast lg:hidden"
            [attr.aria-label]="t('nav.close')"
            (click)="closeMenu()"
          >
            <i class="pi pi-times text-xl!"></i>
          </button>
        </div>

        <nav class="flex-1 overflow-y-auto p-2" [attr.aria-label]="t('nav.label')">
          <ul class="m-0 flex list-none flex-col gap-1 p-0">
            @for (item of navItems; track item.route) {
              <li>
                <a
                  class="flex cursor-pointer items-center gap-2 rounded-lg p-3 text-primary-contrast transition-colors duration-150 hover:bg-primary-emphasis"
                  [routerLink]="item.route"
                  routerLinkActive="bg-primary-emphasis font-semibold"
                  [routerLinkActiveOptions]="item.activeOptions"
                  ariaCurrentWhenActive="page"
                  (click)="closeMenu()"
                >
                  <i class="text-base! leading-none!" [class]="item.icon"></i>
                  <span class="text-base leading-tight">{{ t(item.label) }}</span>
                </a>
              </li>
            }
          </ul>
        </nav>
      </div>
    </aside>

    <!-- `min-w-0`: ohne das zieht die absichtlich breite, selbst scrollende Angebots-Tabelle
         (`min-w-[80rem]`) die ganze Spalte samt Topbar auf ihre Breite — dann verschwindet der
         Theme-Knopf rechts aus dem Bild, statt dass nur die Tabelle horizontal scrollt. -->
    <div class="relative flex min-h-screen min-w-0 flex-auto flex-col">
      <!-- Anders als im Template immer sichtbar, nicht nur mobil — Menü-Knopf und Name
           bleiben aber mobil-only, weil die Sidebar deren Aufgabe auf Desktop schon übernimmt. -->
      <div
        class="relative flex items-center gap-4 border-b border-surface-200 bg-surface-0 px-4 py-4 dark:border-surface-700 dark:bg-surface-900"
      >
        <!-- `min-w-0` + `truncate` auf dem Namen: sonst schiebt ein zu enger Bildschirm den
             Theme-Knopf rechts aus dem Bild statt den Markennamen zu kürzen. Kein verschachteltes
             `flex` für die beiden: ein zweiter Schrumpf-Container schrumpft in Chromium nicht
             zuverlässig unter seine Content-Breite, selbst mit `min-w-0` auf beiden Ebenen. -->
        <button
          type="button"
          class="shrink-0 cursor-pointer text-surface-700 lg:hidden dark:text-surface-100"
          aria-controls="app-sidebar"
          [attr.aria-label]="t('nav.menu')"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          <i class="pi pi-bars text-xl!"></i>
        </button>
        <span class="min-w-0 truncate font-semibold lg:hidden">📡 Freelance Radar</span>

        <!-- User/Notifications aus dem Template sind hier bewusst nicht nachgebaut — es gibt
             weder Nutzerkonten noch Benachrichtigungen in dieser App. Icon-Knopf statt Switch,
             wie auf primeng.dev — zeigt das Ziel des Klicks, nicht den aktuellen Zustand. -->
        <button
          type="button"
          class="ml-auto shrink-0 cursor-pointer text-surface-500 dark:text-surface-400"
          [attr.aria-label]="theme.dark() ? t('nav.themeLight') : t('nav.themeDark')"
          (click)="toggleTheme()"
        >
          <i class="text-xl! leading-none!" [class]="theme.dark() ? 'pi pi-sun' : 'pi pi-moon'"></i>
        </button>
      </div>

      <div class="flex flex-auto flex-col p-4 lg:p-8">
        <router-outlet />
      </div>
    </div>
  </div>
</ng-container>
<p-toast position="top-right" />
