spring.application.name=freelance-radar

# Flyway owns the schema; Hibernate only validates its mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Mail-Abruf (Zugangsdaten kommen aus der git-ignorierten application-local.properties)
spring.config.import=optional:file:./application-local.properties
radar.imap.host=imap.gmx.net
radar.imap.port=993
radar.mail-domain=freelancermap.de
# Die 5 freelancermap-Suchagenten (Namen wie im Postfach-Text, Heuristik matcht case-insensitiv)
radar.agents=Angular,Architekt,Design System,Java Spring,KI/GenAI
radar.max-body-chars=8000
radar.state-dir=.state
